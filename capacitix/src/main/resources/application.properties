
# =========================================================
# APPLICATION
# =========================================================

spring.application.name=capacitix
server.port=${PORT:8080}

# HTTPS behind Render reverse proxy
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}


# =========================================================
# DATABASE - AIVEN CLOUD MYSQL
# =========================================================

spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-3c03a68e-ambule897-561.a.aivencloud.com}:${DB_PORT:25206}/${DB_NAME:defaultdb}?sslMode=${DB_SSL_MODE:REQUIRED}&serverTimezone=Asia/Kolkata

spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# HIKARI CONNECTION POOL
# =========================================================

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.open-in-view=false


# =========================================================
# THYMELEAF
# =========================================================

spring.thymeleaf.cache=${THYMELEAF_CACHE:true}


# =========================================================
# APPLICATION URL
# =========================================================

app.base-url=${APP_BASE_URL:http://localhost:8080}


# =========================================================
# GMAIL SMTP
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

spring.mail.debug=false


# =========================================================
# SPRING AI - GROQ CLOUD API
# =========================================================

# Groq uses an OpenAI-compatible API.
# Base URL excludes /v1 because the completion path adds it.

spring.ai.model.chat=openai

spring.ai.openai.base-url=https://api.groq.com/openai

spring.ai.openai.api-key=${GROQ_API_KEY}

spring.ai.openai.chat.completions-path=/v1/chat/completions

spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-120b}

spring.ai.openai.chat.options.temperature=0.2


# =========================================================
# CUSTOM GROQ CONFIGURATION
# Used by AI services that make direct HTTP requests.
# =========================================================

groq.base-url=https://api.groq.com/openai/v1

groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

groq.api-key=${GROQ_API_KEY}

# Maximum request timeout: 5 minutes
groq.timeout=${GROQ_TIMEOUT:300000}

groq.temperature=0.2

# Maximum generated tokens
groq.max-tokens=${GROQ_MAX_TOKENS:4096}


# =========================================================
# HTTP CLIENT
# =========================================================

spring.http.clients.connect-timeout=15s

spring.http.clients.read-timeout=300s


# =========================================================
# VIDEO / FILE UPLOAD SIZE
# =========================================================

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}

spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:60MB}


# =========================================================
# SECURITY CONFIGURATION
# =========================================================

capacitix.security.remember-me-key=${REMEMBER_ME_KEY:capacitix-dev-only-change-me}

capacitix.security.cookie-secure=${COOKIE_SECURE:false}

server.servlet.session.cookie.http-only=true

server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

server.servlet.session.cookie.same-site=lax


# =========================================================
# LOGGING
# =========================================================

logging.level.com.capacitix.service.AIQuestionGeneratorService=INFO

logging.level.com.capacitix.service.AIChatServiceImpl=INFO

logging.level.org.springframework.web.client=WARN

logging.level.org.hibernate.SQL=WARN

logging.level.org.hibernate.orm.jdbc.bind=OFF
