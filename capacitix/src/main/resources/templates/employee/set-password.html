
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Create your Capacitix password">
<meta name="theme-color" content="#4f46e5">

<title>Create Password | Capacitix</title>

<style>
:root {
    --bg:#f4f6fb;
    --surface:#fff;
    --text:#172033;
    --muted:#667085;
    --line:#e6e9f0;
    --brand:#4f46e5;
    --ok:#059669;
    --bad:#dc2626;
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    font-family:"Segoe UI",system-ui,Arial,sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 88% 4%,rgba(99,91,255,.14),transparent 26rem),
        radial-gradient(circle at 12% 80%,rgba(20,184,166,.12),transparent 24rem),
        var(--bg);
}

.container {
    width:100%;
    max-width:470px;
}

.card {
    position:relative;
    overflow:hidden;
    padding:38px 36px 30px;
    border:1px solid var(--line);
    border-radius:22px;
    background:linear-gradient(160deg,#fff 60%,#f8f8ff);
    box-shadow:0 20px 45px rgba(79,70,229,.14);
    animation:rise .6s ease both;
}

.card::before {
    content:"";
    position:absolute;
    inset:0 0 auto;
    height:4px;
    background:linear-gradient(90deg,#635bff,#14b8a6);
}

.brand {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    margin-bottom:22px;
}

.logo-mark {
    width:58px;
    height:58px;
    display:grid;
    place-items:center;
    border-radius:18px;
    background:linear-gradient(135deg,#6366f1,#14b8a6);
    color:white;
    font-size:26px;
    font-weight:800;
}

.brand-name {
    color:var(--brand);
    font-size:13px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
}

h1 {
    text-align:center;
    font-size:27px;
    margin-bottom:8px;
}

.grad {
    color:var(--brand);
}

.subtitle {
    text-align:center;
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
    margin-bottom:24px;
}

.alert {
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:18px;
    padding:13px 15px;
    border:1px solid #fecaca;
    border-left:4px solid #ef4444;
    border-radius:12px;
    background:#fef2f2;
    color:#991b1b;
    font-size:13px;
    font-weight:600;
    line-height:1.5;
}

.alert[hidden] {
    display:none !important;
}

.employee-info {
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:22px;
    padding:14px 16px;
    border:1px solid #e0e7ff;
    border-radius:16px;
    background:linear-gradient(135deg,#f5f3ff,#eefcf9);
}

.emp-avatar {
    width:46px;
    height:46px;
    flex:0 0 46px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:linear-gradient(135deg,#6366f1,#14b8a6);
    color:white;
    font-weight:700;
}

.emp-body {
    min-width:0;
    flex:1;
}

.emp-row {
    display:flex;
    gap:6px;
    align-items:baseline;
    margin:3px 0;
    font-size:12px;
    color:var(--muted);
}

.emp-row strong {
    flex:none;
    color:#4338ca;
    font-size:11px;
}

.emp-row span {
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:var(--text);
    font-weight:600;
}

.form-group {
    margin-bottom:19px;
}

label {
    display:block;
    margin-bottom:8px;
    color:#344054;
    font-size:13px;
    font-weight:650;
}

.field {
    position:relative;
}

.field input {
    width:100%;
    height:46px;
    padding:0 46px 0 14px;
    border:1px solid #d0d5dd;
    border-radius:12px;
    background:white;
    color:var(--text);
    font-size:14px;
    transition:.2s;
}

.field input:focus {
    outline:none;
    border-color:#8b85ff;
    box-shadow:0 0 0 4px rgba(99,91,255,.12);
}

.field input.invalid {
    border-color:#fca5a5;
}

.field input.valid {
    border-color:#6ee7b7;
}

.toggle {
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    width:34px;
    height:34px;
    border:0;
    border-radius:9px;
    background:transparent;
    cursor:pointer;
}

.meter {
    display:flex;
    gap:5px;
    margin-top:10px;
}

.meter i {
    flex:1;
    height:5px;
    border-radius:20px;
    background:#eef2f6;
}

.meter[data-s="1"] i:nth-child(-n+1) {
    background:#ef4444;
}

.meter[data-s="2"] i:nth-child(-n+2) {
    background:#f59e0b;
}

.meter[data-s="3"] i:nth-child(-n+3) {
    background:#14b8a6;
}

.meter[data-s="4"] i:nth-child(-n+4) {
    background:#059669;
}

.meter-text {
    margin-top:6px;
    min-height:16px;
    color:var(--muted);
    font-size:11px;
}

.password-hint {
    margin-top:8px;
    color:var(--muted);
    font-size:12px;
}

.match {
    margin-top:8px;
    min-height:16px;
    font-size:12px;
    font-weight:600;
}

.match.ok {
    color:var(--ok);
}

.match.no {
    color:var(--bad);
}

.button {
    width:100%;
    height:48px;
    margin-top:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    border:0;
    border-radius:13px;
    background:linear-gradient(135deg,#4f46e5,#6366f1 55%,#0f9e8f);
    color:white;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(79,70,229,.25);
    transition:.2s;
}

.button:hover {
    transform:translateY(-2px);
}

.button:disabled {
    opacity:.7;
    cursor:wait;
}

.spinner {
    width:16px;
    height:16px;
    display:none;
    border:2px solid rgba(255,255,255,.4);
    border-top-color:white;
    border-radius:50%;
    animation:spin .7s linear infinite;
}

.button.loading .spinner {
    display:block;
}

.secure {
    margin-top:16px;
    text-align:center;
    color:var(--muted);
    font-size:11px;
}

.footer {
    margin-top:22px;
    padding-top:16px;
    border-top:1px dashed var(--line);
    text-align:center;
    color:#98a2b3;
    font-size:12px;
}

@keyframes spin {
    to {transform:rotate(360deg);}
}

@keyframes rise {
    from {opacity:0;transform:translateY(15px);}
    to {opacity:1;transform:translateY(0);}
}

@media(max-width:520px) {
    .card {
        padding:30px 22px 24px;
    }

    h1 {
        font-size:23px;
    }
}

@media(prefers-reduced-motion:reduce) {
    *,*::before,*::after {
        animation:none !important;
        transition:none !important;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="card">

    <div class="brand">
        <div class="logo-mark">C</div>
        <div class="brand-name">Capacitix</div>
    </div>

    <h1>Create your <span class="grad">password</span></h1>

    <p class="subtitle">
        Welcome to Capacitix. Create a secure password to activate your account.
    </p>

    <!-- SERVER ERROR -->
    <div class="alert"
         id="serverError"
         role="alert"
         th:if="${errorMessage != null and !#strings.isEmpty(errorMessage)}">

        <span>⚠</span>

        <span th:text="${errorMessage}"></span>
    </div>

    <!-- CLIENT ERROR -->
    <div class="alert"
         id="clientError"
         role="alert"
         hidden>

        <span>⚠</span>
        <span id="clientErrorText"></span>
    </div>

    <!-- EMPLOYEE INFORMATION -->
    <div class="employee-info" th:if="${invitation != null}">

        <div class="emp-avatar"
             th:text="${invitation.name != null and !#strings.isEmpty(invitation.name) ? #strings.substring(invitation.name,0,1).toUpperCase() : 'E'}">
            E
        </div>

        <div class="emp-body">

            <div class="emp-row">
                <strong>Name</strong>
                <span th:text="${invitation.name}"></span>
            </div>

            <div class="emp-row">
                <strong>Email</strong>
                <span th:text="${invitation.email}"></span>
            </div>

            <div class="emp-row" th:if="${invitation.employeeId != null}">
                <strong>ID</strong>
                <span th:text="${invitation.employeeId}"></span>
            </div>

        </div>
    </div>

    <!-- PASSWORD FORM -->
    <form method="post"
          id="pwForm"
          th:action="@{/employee/accept-invitation}"
          novalidate>

        <input type="hidden" name="token" th:value="${token}">

        <input type="hidden"
               th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="form-group">

            <label for="password">Create Password</label>

            <div class="field">

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter your password"
                       minlength="6"
                       required
                       autocomplete="new-password">

                <button type="button"
                        class="toggle"
                        data-target="password"
                        aria-label="Show password">
                    👁
                </button>

            </div>

            <div class="meter" id="meter" data-s="0">
                <i></i><i></i><i></i><i></i>
            </div>

            <div class="meter-text" id="meterText"></div>

            <div class="password-hint">
                Password must contain at least 6 characters.
            </div>

        </div>

        <div class="form-group">

            <label for="confirmPassword">Confirm Password</label>

            <div class="field">

                <input type="password"
                       id="confirmPassword"
                       name="confirmPassword"
                       placeholder="Re-enter your password"
                       minlength="6"
                       required
                       autocomplete="new-password">

                <button type="button"
                        class="toggle"
                        data-target="confirmPassword"
                        aria-label="Show password">
                    👁
                </button>

            </div>

            <div class="match" id="match" aria-live="polite"></div>

        </div>

        <button type="submit" class="button" id="submitBtn">

            <span class="spinner"></span>

            <span id="btnText">
                Create Password &amp; Activate Account
            </span>

        </button>

    </form>

    <div class="secure">
        🔒 Your password is encrypted and never shared.
    </div>

    <div class="footer">
        Capacitix © 2026
    </div>

</div>
</div>

<script>
(function () {

    const form = document.getElementById("pwForm");

    if (!form) return;

    const pw = document.getElementById("password");
    const cf = document.getElementById("confirmPassword");

    const meter = document.getElementById("meter");
    const meterText = document.getElementById("meterText");

    const match = document.getElementById("match");

    const error = document.getElementById("clientError");
    const errorText = document.getElementById("clientErrorText");

    const btn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");

    let submitting = false;

    // Hide stale server error when the page is restored
    // from browser back-forward cache.
    window.addEventListener("pageshow", function () {
        submitting = false;
        btn.disabled = false;
        btn.classList.remove("loading");
        btnText.textContent = "Create Password & Activate Account";
    });

    // Show / hide password.
    document.querySelectorAll(".toggle").forEach(function (toggle) {

        toggle.addEventListener("click", function () {

            const input = document.getElementById(
                toggle.dataset.target
            );

            const show = input.type === "password";

            input.type = show ? "text" : "password";

            toggle.textContent = show ? "🙈" : "👁";

            toggle.setAttribute(
                "aria-label",
                show ? "Hide password" : "Show password"
            );

        });

    });

    // Password strength.
    function strength(value) {

        if (!value) return 0;

        let score = 0;

        if (value.length >= 6) score++;
        if (value.length >= 10) score++;
        if (/[a-z]/.test(value) && /[A-Z]/.test(value)) score++;
        if (/\d/.test(value) && /[^A-Za-z0-9]/.test(value)) score++;

        return Math.max(1, score);

    }

    const strengthLabels = [
        "",
        "Weak",
        "Fair",
        "Good",
        "Strong"
    ];

    function updateStrength() {

        const score = strength(pw.value);

        meter.dataset.s = score;

        meterText.textContent = score
            ? "Strength: " + strengthLabels[score]
            : "";

    }

    // Confirm password.
    function updateMatch() {

        if (!cf.value) {

            match.textContent = "";
            match.className = "match";

            cf.classList.remove("valid", "invalid");

            return;

        }

        const matched = pw.value === cf.value;

        match.textContent = matched
            ? "✓ Passwords match"
            : "✕ Passwords do not match";

        match.className = "match " + (matched ? "ok" : "no");

        cf.classList.toggle("valid", matched);
        cf.classList.toggle("invalid", !matched);

    }

    // Show inline error.
    function showError(message, field) {

        errorText.textContent = message;

        error.hidden = false;

        if (field) {

            field.classList.add("invalid");
            field.focus();

        }

    }

    function clearError() {

        error.hidden = true;
        errorText.textContent = "";

    }

    pw.addEventListener("input", function () {

        clearError();

        pw.classList.remove("invalid");

        updateStrength();
        updateMatch();

    });

    cf.addEventListener("input", function () {

        clearError();

        updateMatch();

    });

    // Form validation.
    form.addEventListener("submit", function (event) {

        if (submitting) {

            event.preventDefault();
            return;

        }

        if (pw.value.length < 6) {

            event.preventDefault();

            showError(
                "Password must contain at least 6 characters.",
                pw
            );

            return;

        }

        if (pw.value !== cf.value) {

            event.preventDefault();

            showError(
                "Passwords do not match.",
                cf
            );

            return;

        }

        if (!form.querySelector('input[name="token"]').value) {

            event.preventDefault();

            showError(
                "Invitation token is missing. Please open the invitation link again."
            );

            return;

        }

        clearError();

        submitting = true;

        btn.disabled = true;

        btn.classList.add("loading");

        btnText.textContent = "Activating account...";

    });

})();
</script>

</body>
</html>
