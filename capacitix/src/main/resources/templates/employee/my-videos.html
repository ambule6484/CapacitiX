<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Training Videos | Capacitix</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .header {
            background: #ffffff;
            padding: 20px 35px;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .back-btn {
            text-decoration: none;
            color: #4f46e5;
            font-weight: 600;
        }

        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .message {
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            background: white;
            padding: 55px 25px;
            text-align: center;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
        }

        .empty h2 {
            margin-bottom: 10px;
        }

        .empty p {
            color: #6b7280;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(320px, 1fr)
            );

            gap: 22px;
        }

        .video-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
        }

        .video-preview {
            height: 190px;
            background: #111827;
        }

        .video-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-content {
            padding: 20px;
        }

        .video-title {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .description {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .trainer {
            font-size: 14px;
            margin-bottom: 8px;
        }

        .assigned {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 15px;
        }

        .progress-container {
            margin-bottom: 15px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #4f46e5;
            border-radius: 10px;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .status-assigned {
            background: #e0e7ff;
            color: #3730a3;
        }

        .status-progress {
            background: #fef3c7;
            color: #92400e;
        }

        .status-completed {
            background: #dcfce7;
            color: #166534;
        }

        .watch-btn {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            background: #4f46e5;
            color: white;
            padding: 11px;
            border-radius: 8px;
            font-weight: 600;
        }

        .watch-btn:hover {
            background: #4338ca;
        }

        @media (max-width: 600px) {

            .header {
                padding: 18px;
            }

            .header h1 {
                font-size: 20px;
            }

            .container {
                margin-top: 25px;
            }

        }

    </style>

</head>

<body>

<header class="header">

    <h1>My Training Videos</h1>

    <a th:href="@{/employee/dashboard}"
       class="back-btn">
        ← Dashboard
    </a>

</header>


<div class="container">

    <!-- Success -->
    <div th:if="${success}"
         class="message success"
         th:text="${success}">
    </div>

    <!-- Error -->
    <div th:if="${error}"
         class="message error"
         th:text="${error}">
    </div>


    <!-- No videos -->
    <div th:if="${#lists.isEmpty(assignments)}"
         class="empty">

        <h2>No Training Videos Assigned</h2>

        <p>
            Your trainer has not assigned any training videos yet.
        </p>

    </div>


    <!-- Video list -->
    <div th:unless="${#lists.isEmpty(assignments)}"
         class="video-grid">


        <div class="video-card"
             th:each="assignment : ${assignments}">


            <!-- Video Preview -->
            <div class="video-preview">

                <video controls
                       preload="metadata">

                    <source th:src="${assignment.video.videoUrl}"
                            type="video/mp4">

                    Your browser does not support video playback.

                </video>

            </div>


            <div class="video-content">


                <!-- Title -->
                <div class="video-title"
                     th:text="${assignment.video.title}">

                    Java Collections

                </div>


                <!-- Description -->
                <div class="description"
                     th:text="${assignment.video.description}">

                    Learn Java Collections.

                </div>


                <!-- Trainer -->
                <div class="trainer">

                    Trainer:

                    <strong
                        th:text="${assignment.trainer.fullName}">
                        Trainer Name
                    </strong>

                </div>


                <!-- Assigned Date -->
                <div class="assigned">

                    Assigned:

                    <span
                        th:text="${#temporals.format(
                            assignment.assignedAt,
                            'dd MMM yyyy'
                        )}">
                        03 Oct 2026
                    </span>

                </div>


                <!-- Status -->

                <span
                    th:if="${assignment.status.name() == 'ASSIGNED'}"
                    class="status status-assigned">

                    Assigned

                </span>


                <span
                    th:if="${assignment.status.name() == 'IN_PROGRESS'}"
                    class="status status-progress">

                    In Progress

                </span>


                <span
                    th:if="${assignment.status.name() == 'COMPLETED'}"
                    class="status status-completed">

                    Completed

                </span>


                <!-- Progress -->

                <div class="progress-container">

                    <div class="progress-header">

                        <span>Progress</span>

                        <strong
                            th:text="${assignment.progressPercentage + '%'}">
                            0%
                        </strong>

                    </div>

                    <div class="progress-bar">

                        <div class="progress-fill"
                             th:style="'width:' +
                             ${assignment.progressPercentage} +
                             '%'">
                        </div>

                    </div>

                </div>


                <!-- Watch -->

                <a th:href="@{/employee/videos/{id}
                    (id=${assignment.id})}"
                   class="watch-btn">

                    <span
                        th:if="${assignment.progressPercentage == 0}">
                        Start Training
                    </span>

                    <span
                        th:if="${assignment.progressPercentage > 0
                            and assignment.progressPercentage < 100}">
                        Continue Watching
                    </span>

                    <span
                        th:if="${assignment.progressPercentage >= 100}">
                        Watch Again
                    </span>

                </a>


            </div>

        </div>

    </div>

</div>

</body>

</html>
