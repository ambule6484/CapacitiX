
# =========================================================
# APPLICATION
# =========================================================

spring.application.name=capacitix
server.port=${PORT:8080}

# Support HTTPS behind cloud hosting reverse proxies
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}


# =========================================================
# DATABASE - AIVEN CLOUD MYSQL
# =========================================================

spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-3c03a68e-ambule897-561.a.aivencloud.com}:${DB_PORT:25206}/${DB_NAME:defaultdb}?sslMode=${DB_SSL_MODE:REQUIRED}&serverTimezone=Asia/Kolkata

spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# HIKARI CONNECTION POOL
# =========================================================

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000


# =========================================================
# JPA / HIBERNATE
# =========================================================

# Local default: update
# Production: set DDL_AUTO=validate after schema is prepared

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.open-in-view=false


# =========================================================
# THYMELEAF
# =========================================================

spring.thymeleaf.cache=${THYMELEAF_CACHE:true}


# =========================================================
# APPLICATION URL
# =========================================================

# Local: http://localhost:8080
# Production: set APP_BASE_URL to your deployed HTTPS URL

app.base-url=${APP_BASE_URL:http://localhost:8080}


# =========================================================
# GMAIL SMTP
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

spring.mail.debug=false


# =========================================================
# SPRING AI - OLLAMA
# =========================================================

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}

spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.2}

spring.ai.model.chat=ollama

spring.ai.ollama.chat.options.temperature=0.2

spring.ai.ollama.chat.options.num-predict=1024


# =========================================================
# CUSTOM OLLAMA CONFIGURATION
# =========================================================

ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}

ollama.model=${OLLAMA_MODEL:llama3.2}

# Maximum AI request timeout: 5 minutes
ollama.timeout=${OLLAMA_TIMEOUT:300000}

ollama.temperature=0.2

# Used by AIQuestionGeneratorService
ollama.num-predict=2048

# Keep model loaded between requests
ollama.keep-alive=30m


# =========================================================
# HTTP CLIENT
# =========================================================

spring.http.clients.connect-timeout=10s

spring.http.clients.read-timeout=300s


# =========================================================
# VIDEO / FILE UPLOAD SIZE
# =========================================================

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}

spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:60MB}


# =========================================================
# SECURITY CONFIGURATION
# =========================================================

# Never use the development fallback in production.
capacitix.security.remember-me-key=${REMEMBER_ME_KEY:capacitix-dev-only-change-me}

# Local HTTP=false | Production HTTPS=true
capacitix.security.cookie-secure=${COOKIE_SECURE:false}

# Session cookie security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax


# =========================================================
# LOGGING
# =========================================================

logging.level.com.capacitix.service.AIQuestionGeneratorService=INFO

logging.level.com.capacitix.service.AIChatServiceImpl=INFO

logging.level.org.springframework.web.client=WARN

logging.level.org.hibernate.SQL=WARN

logging.level.org.hibernate.orm.jdbc.bind=OFF
