# =========================================================
# SPRING AI - OLLAMA
# Used by Spring AI services
# =========================================================

spring.ai.ollama.base-url=http://localhost:11434

spring.ai.ollama.chat.options.model=llama3.2

spring.ai.model.chat=ollama

spring.ai.ollama.chat.options.temperature=0.3

spring.ai.ollama.chat.options.num-predict=2048


# =========================================================
# CUSTOM OLLAMA CONFIGURATION
# Used by AIQuestionGeneratorService.java
# =========================================================

ollama.base-url=http://localhost:11434

ollama.model=llama3.2

# Maximum time allowed for an Ollama request
ollama.timeout=180000

# Lower temperature for consistent assessment questions
ollama.temperature=0.2

# Allow sufficient output for a batch of 10 MCQs
ollama.num-predict=4096

# Keep the model loaded between requests
ollama.keep-alive=30m


# =========================================================
# HTTP CLIENT
# =========================================================

spring.http.clients.connect-timeout=10s

spring.http.clients.read-timeout=180s


# =========================================================
# VIDEO / FILE UPLOAD SIZE
# =========================================================

spring.servlet.multipart.max-file-size=500MB

spring.servlet.multipart.max-request-size=500MB


# =========================================================
# LOGGING
# =========================================================

logging.level.com.capacitix.service.AIQuestionGeneratorService=INFO

logging.level.org.springframework.web.client=INFO

logging.level.org.hibernate.SQL=WARN
