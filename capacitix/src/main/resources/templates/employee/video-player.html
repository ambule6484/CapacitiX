<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Watch Training Video | Capacitix</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .header {
            background: white;
            padding: 20px 35px;
            border-bottom: 1px solid #e5e7eb;
        }

        .header a {
            text-decoration: none;
            color: #4f46e5;
            font-weight: 600;
        }

        .container {
            max-width: 1000px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .video-container {
            background: #000;
            width: 100%;
        }

        .video-container video {
            display: block;
            width: 100%;
            max-height: 600px;
        }

        .content {
            padding: 28px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 26px;
        }

        .description {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .trainer {
            margin-bottom: 20px;
            font-size: 14px;
        }

        .progress-section {
            margin-top: 25px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #4f46e5;
            border-radius: 10px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        button,
        .back-btn {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .complete-btn {
            background: #16a34a;
            color: white;
        }

        .back-btn {
            background: #f3f4f6;
            color: #374151;
        }

        .message {
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .completed {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 9px 14px;
            border-radius: 8px;
            font-weight: 600;
        }

    </style>

</head>

<body>


<div class="header">

    <a th:href="@{/employee/videos}">
        ← My Training Videos
    </a>

</div>


<div class="container">


    <!-- Messages -->

    <div th:if="${success}"
         class="message success"
         th:text="${success}">
    </div>

    <div th:if="${error}"
         class="message error"
         th:text="${error}">
    </div>


    <div class="card">


        <!-- Video -->

        <div class="video-container">

            <video id="trainingVideo"
                   controls
                   preload="metadata">

                <source th:src="${video.videoUrl}"
                        type="video/mp4">

                Your browser does not support video playback.

            </video>

        </div>


        <div class="content">


            <!-- Title -->

            <h1 th:text="${video.title}">
                Java Collections
            </h1>


            <!-- Description -->

            <div class="description"
                 th:text="${video.description}">
                Learn Java Collections Framework.
            </div>


            <!-- Trainer -->

            <div class="trainer">

                Assigned by:

                <strong
                    th:text="${assignment.trainer.fullName}">
                    Trainer Name
                </strong>

            </div>


            <!-- Progress -->

            <div class="progress-section">

                <div class="progress-header">

                    <span>Video Progress</span>

                    <strong id="progressText"
                            th:text="${assignment.progressPercentage + '%'}">
                        0%
                    </strong>

                </div>


                <div class="progress-bar">

                    <div id="progressFill"
                         class="progress-fill"
                         th:style="'width:' +
                         ${assignment.progressPercentage} +
                         '%'">
                    </div>

                </div>

            </div>


            <!-- Actions -->

            <div class="actions">


                <a th:href="@{/employee/videos}"
                   class="back-btn">

                    Back

                </a>


                <!-- Complete button -->

                <form
                    th:if="${assignment.progressPercentage < 100}"
                    th:action="@{/employee/videos/{id}/complete
                        (id=${assignment.id})}"
                    method="post">

                    <button type="submit"
                            class="complete-btn">

                        Mark as Completed

                    </button>

                </form>


                <!-- Completed -->

                <span
                    th:if="${assignment.progressPercentage >= 100}"
                    class="completed">

                    ✓ Training Completed

                </span>


            </div>


        </div>

    </div>

</div>


<script>

    const video =
        document.getElementById("trainingVideo");

    const progressText =
        document.getElementById("progressText");

    const progressFill =
        document.getElementById("progressFill");

    let lastSentProgress = -1;


    /*
     * Update progress while employee watches.
     */
    video.addEventListener("timeupdate", function () {

        if (!video.duration || isNaN(video.duration)) {
            return;
        }

        const progress =
            Math.floor(
                (video.currentTime / video.duration) * 100
            );

        progressText.textContent =
            progress + "%";

        progressFill.style.width =
            progress + "%";


        /*
         * Send progress to server only when
         * percentage changes.
         */
        if (progress !== lastSentProgress) {

            lastSentProgress = progress;

            fetch(
                "[[@{/employee/videos/{id}/progress(id=${assignment.id})}]]",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded",

                        "X-CSRF-TOKEN":
                            getCsrfToken()
                    },

                    body:
                        "progress=" + progress
                }
            );

        }

    });


    /*
     * Get CSRF token from Thymeleaf page.
     */
    function getCsrfToken() {

        const meta =
            document.querySelector(
                'meta[name="_csrf"]'
            );

        return meta
            ? meta.getAttribute("content")
            : "";

    }

</script>


</body>

</html>
