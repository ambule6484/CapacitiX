
# =========================================================
# APPLICATION
# =========================================================

spring.application.name=capacitix
server.port=${PORT:8080}

server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}


# =========================================================
# DATABASE - AIVEN CLOUD MYSQL
# =========================================================

spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-3c03a68e-ambule897-561.a.aivencloud.com}:${DB_PORT:25206}/${DB_NAME:defaultdb}?sslMode=${DB_SSL_MODE:REQUIRED}&serverTimezone=Asia/Kolkata

spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# HIKARI CONNECTION POOL
# =========================================================

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Hibernate automatically detects MySQL dialect
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.open-in-view=false


# =========================================================
# THYMELEAF
# =========================================================

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}


# =========================================================
# APPLICATION URL
# =========================================================

app.base-url=${APP_BASE_URL:http://localhost:8080}


# =========================================================
# GMAIL SMTP CONFIGURATION
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Gmail account address
spring.mail.username=${MAIL_USERNAME:}

# Google 16-character App Password
spring.mail.password=${MAIL_PASSWORD:}

# SMTP authentication
spring.mail.properties.mail.smtp.auth=true

# TLS security
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# SMTP connection timeout
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# SMTP protocol
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.transport.protocol=smtp

# Disable SMTP credential debugging
spring.mail.debug=false


# =========================================================
# GROQ AI - COMMON CONFIGURATION
# =========================================================

# Configure GROQ_API_KEY in environment variables.
# Never hardcode the actual API key.

groq.api.key=${GROQ_API_KEY:}

groq.api.url=https://api.groq.com/openai/v1

groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}

# Default Groq model
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

# Connection and response timeout
groq.connect-timeout=15000
groq.timeout=300000

# Common AI defaults
groq.temperature=0.2
groq.max-tokens=8192


# =========================================================
# GROQ - LEARNING PATH GENERATION
# =========================================================

# Uses common Groq configuration above.


# =========================================================
# GROQ - PRACTICAL TASK GENERATION
# =========================================================

groq.practical-task.max-tokens=2500


# =========================================================
# GROQ - AI CHAT ASSISTANT
# =========================================================

groq.chat.timeout=60000
groq.chat.temperature=0.4
groq.chat.max-tokens=1200


# =========================================================
# GROQ - ASSESSMENT GENERATION
# =========================================================

# Assessment generation may require longer responses.
groq.assessment.timeout=300000
groq.assessment.temperature=0.2
groq.assessment.max-tokens=8192


# =========================================================
# HTTP CLIENT
# =========================================================

spring.http.clients.connect-timeout=10s
spring.http.clients.read-timeout=60s


# =========================================================
# VIDEO / FILE UPLOAD SIZE
# =========================================================

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:60MB}


# =========================================================
# SECURITY CONFIGURATION
# =========================================================

capacitix.security.remember-me-key=${REMEMBER_ME_KEY:capacitix-dev-only-change-me}

capacitix.security.cookie-secure=${COOKIE_SECURE:false}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax


# =========================================================
# LOGGING
# =========================================================

logging.level.com.capacitix.service.AIQuestionGeneratorService=INFO
logging.level.com.capacitix.service.AIChatServiceImpl=INFO
logging.level.com.capacitix.service.AIServiceImpl=INFO
logging.level.com.capacitix.service.AIPracticalTaskGeneratorImpl=INFO

logging.level.org.springframework.web.client=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF
