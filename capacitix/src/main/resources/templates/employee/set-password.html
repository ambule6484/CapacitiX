
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Password | CapacitiX</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
        }

        .logo {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #4f46e5;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 10px;
            color: #172033;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .employee-info {
            background: #f4f3ff;
            padding: 15px;
            border-radius: 7px;
            margin-bottom: 22px;
            font-size: 14px;
        }

        .employee-info p {
            margin-bottom: 8px;
        }

        .employee-info p:last-child {
            margin-bottom: 0;
        }

        .employee-info strong {
            color: #4f46e5;
        }

        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d0d5dd;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .hint {
            font-size: 12px;
            color: #777;
            margin-top: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">CapacitiX</div>

        <h1>Create Your Password</h1>

        <p class="subtitle">
            Welcome to CapacitiX. Create a password to activate your employee account.
        </p>

        <!-- Error Message -->
        <div class="message error"
             th:if="${errorMessage != null}"
             th:text="${errorMessage}">
        </div>

        <!-- Employee Information -->
        <div class="employee-info" th:if="${invitation != null}">

            <p>
                <strong>Name:</strong>
                <span th:text="${invitation.name}">Employee Name</span>
            </p>

            <p>
                <strong>Email:</strong>
                <span th:text="${invitation.email}">employee@example.com</span>
            </p>

            <p th:if="${invitation.employeeId != null}">
                <strong>Employee ID:</strong>
                <span th:text="${invitation.employeeId}">EMP001</span>
            </p>

        </div>

        <!-- Password Form -->
        <form method="post"
              th:action="@{/employee/accept-invitation}"
              id="passwordForm">

            <!-- Invitation Token -->
            <input type="hidden" name="token" th:value="${token}">

            <!-- CSRF Token -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="form-group">

                <label for="password">Create Password</label>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter your password"
                       minlength="6"
                       required
                       autocomplete="new-password">

                <p class="hint">
                    Password must contain at least 6 characters.
                </p>

            </div>

            <div class="form-group">

                <label for="confirmPassword">Confirm Password</label>

                <input type="password"
                       id="confirmPassword"
                       name="confirmPassword"
                       placeholder="Confirm your password"
                       minlength="6"
                       required
                       autocomplete="new-password">

            </div>

            <button type="submit">
                Create Password &amp; Activate Account
            </button>

        </form>

        <div class="footer">
            CapacitiX &copy; 2026
        </div>

    </div>

    <script>
        document.getElementById("passwordForm").addEventListener("submit", function(event) {

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password.length < 6) {
                event.preventDefault();
                alert("Password must contain at least 6 characters.");
                return;
            }

            if (password !== confirmPassword) {
                event.preventDefault();
                alert("Passwords do not match.");
            }

        });
    </script>

</body>
</html>
