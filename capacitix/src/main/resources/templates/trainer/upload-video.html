<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Training Video | Capacitix</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .header {
            background: white;
            padding: 20px 35px;
            border-bottom: 1px solid #e5e7eb;
        }

        .header a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        .container {
            max-width: 700px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 32px;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 28px;
        }

        .message {
            padding: 13px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        input[type="file"] {
            padding: 10px;
            background: #f9fafb;
        }

        .hint {
            margin-top: 7px;
            color: #6b7280;
            font-size: 13px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button,
        .cancel {
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-size: 15px;
        }

        button {
            border: none;
            background: #4f46e5;
            color: white;
        }

        .cancel {
            background: #f3f4f6;
            color: #374151;
        }

        button:hover {
            background: #4338ca;
        }
    </style>
</head>

<body>

<div class="header">
    <a th:href="@{/trainer/videos}">
        ← Back to Training Videos
    </a>
</div>

<div class="container">

    <div class="card">

        <h1>Upload Training Video</h1>

        <p class="subtitle">
            Upload a training video that can be assigned to Students.
        </p>

        <div th:if="${error}"
             class="message error"
             th:text="${error}">
        </div>

        <form th:action="@{/trainer/videos/upload}"
              method="post"
              enctype="multipart/form-data">

            <div class="form-group">

                <label for="title">
                    Video Title
                </label>

                <input type="text"
                       id="title"
                       name="title"
                       placeholder="Example: Java Collections"
                       required>

            </div>

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea id="description"
                          name="description"
                          placeholder="Explain what the Student will learn from this video..."></textarea>

            </div>

            <div class="form-group">

                <label for="file">
                    Video File
                </label>

                <input type="file"
                       id="file"
                       name="file"
                       accept="video/*"
                       required>

                <div class="hint">
                    Select a valid video file.
                </div>

            </div>

            <div class="actions">

                <button type="submit">
                    Upload Video
                </button>

                <a th:href="@{/trainer/videos}"
                   class="cancel">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
