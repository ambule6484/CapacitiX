<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Training Videos | Capacitix</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .header {
            background: #ffffff;
            padding: 20px 35px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .upload-btn {
            background: #4f46e5;
            color: white;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: 600;
        }

        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .message {
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 22px;
        }

        .video-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
        }

        .video-preview {
            background: #111827;
            height: 190px;
        }

        .video-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-content {
            padding: 18px;
        }

        .video-title {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .description {
            color: #6b7280;
            font-size: 14px;
            min-height: 40px;
            margin-bottom: 12px;
        }

        .date {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            border: none;
            cursor: pointer;
            padding: 9px 13px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        .assign {
            background: #4f46e5;
            color: white;
        }

        .delete {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 600px) {
            .header {
                padding: 18px;
            }

            .header h1 {
                font-size: 20px;
            }

            .upload-btn {
                padding: 9px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h1>Training Videos</h1>

    <a th:href="@{/trainer/videos/upload}"
       class="upload-btn">
        + Upload Video
    </a>
</header>

<div class="container">

    <!-- Success message -->
    <div th:if="${success}"
         class="message success"
         th:text="${success}">
    </div>

    <!-- Error message -->
    <div th:if="${error}"
         class="message error"
         th:text="${error}">
    </div>

    <!-- No videos -->
    <div th:if="${#lists.isEmpty(videos)}"
         class="empty">

        <h2>No Training Videos</h2>

        <p style="margin-top: 10px; color: #6b7280;">
            Upload your first training video to assign it to Students.
        </p>

    </div>

    <!-- Videos -->
    <div th:unless="${#lists.isEmpty(videos)}"
         class="video-grid">

        <div class="video-card"
             th:each="video : ${videos}">

            <div class="video-preview">

                <video controls preload="metadata">
                    <source th:src="${video.videoUrl}"
                            type="video/mp4">

                    Your browser does not support video playback.
                </video>

            </div>

            <div class="video-content">

                <div class="video-title"
                     th:text="${video.title}">
                    Video Title
                </div>

                <div class="description"
                     th:text="${video.description}">
                    Video description
                </div>

                <div class="date">
                    Uploaded:
                    <span th:text="${#temporals.format(video.uploadedAt, 'dd MMM yyyy, hh:mm a')}">
                        03 Oct 2026
                    </span>
                </div>

                <div class="actions">

                    <a th:href="@{/trainer/videos/{id}/assign(id=${video.id})}"
                       class="btn assign">
                        Assign Students
                    </a>

                    <form th:action="@{/trainer/videos/{id}/delete(id=${video.id})}"
                          method="post"
                          onsubmit="return confirm('Remove this video?');">

                        <button type="submit"
                                class="btn delete">
                            Remove
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
