<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Capacitix</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 45px rgba(15, 23, 42, 0.12);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 62px;
            height: 62px;
            margin: 0 auto 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #4f46e5, #0d9488);
            color: white;
            font-size: 27px;
            font-weight: 700;
        }

        h1 {
            text-align: center;
            color: #111827;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .message {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        .success-message {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .error-message {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 18px;
        }

        input[type="email"] {
            width: 100%;
            height: 52px;
            border: 1px solid #dbe2ea;
            border-radius: 11px;
            padding: 0 15px 0 45px;
            font-size: 15px;
            color: #111827;
            outline: none;
            transition: 0.2s ease;
        }

        input[type="email"]:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.10);
        }

        input[type="email"]::placeholder {
            color: #9ca3af;
        }

        .submit-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #4f46e5, #0d9488);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.22);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .back-login {
            text-align: center;
            margin-top: 25px;
        }

        .back-login a {
            color: #4f46e5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        .security-note {
            margin-top: 25px;
            padding: 13px;
            background: #f8fafc;
            border-radius: 10px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
            line-height: 1.5;
        }

        @media (max-width: 500px) {

            .container {
                padding: 30px 22px;
                border-radius: 16px;
            }

            h1 {
                font-size: 24px;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <!-- LOGO -->
    <div class="logo">
        C
    </div>

    <!-- HEADING -->
    <h1>Forgot Password?</h1>

    <p class="subtitle">
        Enter your registered email address and we will
        send you a one-time password (OTP).
    </p>

    <!-- SUCCESS MESSAGE -->
    <div th:if="${message}"
         class="message success-message"
         th:text="${message}">
        If an account exists with this email, an OTP has been sent.
    </div>

    <!-- ERROR MESSAGE -->
    <div th:if="${error}"
         class="message error-message"
         th:text="${error}">
        Unable to send OTP. Please try again.
    </div>

    <!-- FORGOT PASSWORD FORM -->
    <form th:action="@{/forgot-password}"
          method="post"
          id="forgotPasswordForm">

        <!-- CSRF TOKEN -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <!-- EMAIL -->
        <div class="form-group">

            <label for="email">
                Registered Email Address
            </label>

            <div class="input-wrapper">

                <span class="input-icon">
                    ✉
                </span>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email address"
                       autocomplete="email"
                       required>

            </div>

        </div>

        <!-- SUBMIT -->
        <button type="submit"
                class="submit-btn"
                id="sendOtpBtn">

            Send OTP

        </button>

    </form>

    <!-- SECURITY NOTE -->
    <div class="security-note">
        🔒 Your OTP is valid for 10 minutes.
        Do not share your OTP with anyone.
    </div>

    <!-- BACK TO LOGIN -->
    <div class="back-login">

        <a th:href="@{/login}">
            ← Back to Login
        </a>

    </div>

</div>

<script>

    const form = document.getElementById("forgotPasswordForm");
    const button = document.getElementById("sendOtpBtn");

    form.addEventListener("submit", function () {

        const email = document.getElementById("email").value.trim();

        if (!email) {
            return;
        }

        /*
         * Prevent double-clicking the button while
         * the OTP request is being processed.
         */

        button.disabled = true;
        button.textContent = "Sending OTP...";

    });

</script>

</body>

</html>
